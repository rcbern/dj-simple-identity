[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "python-json-logger>=4.1.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]
